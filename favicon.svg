<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <style>
        .bg     { fill: #0a0c0b; }
        .stroke { stroke: #8fe0b0; }
        .dot    { fill: #8fe0b0; }
        
        /* Светлая тема браузера */
        @media (prefers-color-scheme: light) {
            .bg     { fill: #f3f7f4; }
            .stroke { stroke: #101613; }
            .dot    { fill: #1f7a4a; }
        }
    </style>
    
    <rect class="bg" width="100" height="100"/>
    <polygon class="stroke" points="50,12 83,31 83,69 50,88 17,69 17,31" fill="none" stroke-width="6" stroke-linejoin="miter"/>
        <circle class="dot" cx="50" cy="50" r="10"/>
</svg>