name: sync-filepilot-changelog

# Раз в день и по кнопке подтягивает «Что нового» из релизов FilePilot в projects.json.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подтянуть CHANGELOG и даты релизов
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync-changelog.py
          python3 scripts/build-project-pages.py
      - name: Закоммитить, если что-то изменилось
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Что нового: обновление из релизов FilePilot"
            git push
          fi
