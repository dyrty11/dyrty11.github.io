name: site-checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Проверки сайта (CSP, ссылки, секреты)
        run: python3 .github/scripts/check_site.py
      - name: Синтаксис JavaScript
        run: for f in *.js; do node --check "$f"; done
