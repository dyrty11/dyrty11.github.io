[package]
name = "qr-core"
version = "0.1.0"
edition = "2021"
description = "Быстрое построение матрицы QR-кода для qr.html (WebAssembly)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qrcodegen = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
